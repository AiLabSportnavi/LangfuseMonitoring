# Prometheus + Grafana monitoring for the Tier 1 stack.
#
# Must be passed explicitly, alongside compose.yaml:
#
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
#
# Deliberately NOT named compose.override.yaml. That name is auto-loaded, and
# monitoring must be an explicit choice — the same reasoning that keeps
# compose.local.yaml from publishing the web port on the Hetzner box by accident.
#
# Same project name, so these services join the existing `langfuse` network and
# reach every component by DNS name. Kept in a separate file so monitoring can be
# added, upgraded, or removed without editing the file that defines the platform.
#
# ══════════════════════════════════════════════════════════════════════════════
# NO SERVICE HERE PUBLISHES A HOST PORT.
#
# Caddy remains the only ingress (CLAUDE.md §12.1). Grafana is reached through
# the grafana.<domain> site block in the Caddyfile, gated by Entra ID SSO
# (single-tenant). There is no IP allowlist — see that block for why it was
# removed rather than repaired.
# Prometheus has NO web ingress at all — it is an unauthenticated admin surface
# with a query API that can read every metric, and nothing needs to reach it but
# Grafana. Use an SSH tunnel for ad-hoc PromQL:
#
#   ssh -L 9090:localhost:9090 box   # then docker compose port, or exec curl
#
# scripts/test-monitoring-config.sh asserts this invariant.
# ══════════════════════════════════════════════════════════════════════════════
#
# Image tags were verified against their registries on 2026-08-11, not guessed
# from memory — DEPLOYMENT-PITFALLS.md #8 records a deploy that failed on a stale
# tag copied out of a plan. Re-verify with:
#
#   ./scripts/test-monitoring-config.sh --pull-check
#
#   prom/prometheus                        v3.13.2
#   grafana/grafana                        13.0.6
#   prom/node-exporter                     v1.12.1
#   gcr.io/cadvisor/cadvisor               v0.55.1
#   prometheuscommunity/postgres-exporter  v0.20.1
#   oliver006/redis_exporter               v1.89.0-alpine
#   prom/blackbox-exporter                 v0.28.0

# ── NETWORK SPLIT (audit: flat-network finding) ───────────────────────────────
# Before this, every monitoring component shared one bridge with Postgres,
# ClickHouse, Valkey and MinIO — so a compromise of any exporter had direct
# network reach to every datastore. cAdvisor is the sharp edge of
# that: even de-privileged (F-09) it still holds host mounts and SYS_PTRACE,
# and it needs to open a connection to nothing at all.
#
# The rule applied below: a service joins `langfuse` ONLY if it must open a
# connection to a platform component.
#
#   monitoring only  → grafana, node-exporter, cadvisor   (talk to nothing)
#   both             → prometheus (scrapes caddy/clickhouse/minio on langfuse,
#                      and the exporters), blackbox-exporter (probes web and
#                      worker by design), caddy (proxies to grafana)
#   langfuse only    → postgres-exporter, redis-exporter — they connect INTO the
#                      datastores, and Prometheus reaches them over `langfuse`.
#
# This is a real reduction, not a cosmetic one: after it, node-exporter and
# cAdvisor cannot route to Postgres, ClickHouse, Valkey or MinIO at
# all. It does not isolate the exporters that legitimately hold datastore
# credentials — no network layout can, since connecting is their function.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ── Overrides on existing services ────────────────────────────────────────
  # Caddy joins the monitoring network so the Grafana site block can reach
  # grafana:3000. Without this override Grafana is unreachable after the split
  # and the vhost returns 502 — which looks exactly like a broken Grafana.
  caddy:
    networks: [langfuse, monitoring]

  # MinIO has a native Prometheus endpoint but requires a signed request by
  # default. `public` drops that requirement for /minio/v2/metrics/* only — the
  # S3 API itself remains fully authenticated. Acceptable because MinIO publishes
  # no host port, so the endpoint is reachable only from the Docker network.
  #
  # Applied here rather than in compose.yaml so that file stays untouched: run
  # without this override and MinIO simply refuses the scrape.
  minio:
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.13.2
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days to match the platform's trace retention, so a volume spike can be
      # correlated against trace data covering the same window.
      - --storage.tsdb.retention.time=90d
      # A HARD backstop, not a target. The single biggest risk on this box is
      # NVMe exhaustion stopping ingestion (CLAUDE.md §10.1). The monitoring
      # stack must never become the cause of the failure it exists to warn about,
      # so size retention wins over time retention when they conflict.
      - --storage.tsdb.retention.size=10GB
      # Lets `docker compose kill -s SIGHUP prometheus` apply config changes
      # without dropping the TSDB's in-memory head block.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules (audit F-12). Mounted as a directory so a new rule file is
      # a file addition plus a SIGHUP, not a compose edit.
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # file_sd targets for the edge-tls job. Absent on a fresh deploy — the
      # job is then simply empty. See prometheus/targets/README.md.
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [langfuse, monitoring]

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    <<: *hardening
    image: grafana/grafana:13.0.6
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      TZ: UTC
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # `:?` so an unset value FAILS THE COMMAND rather than defaulting to a
      # blank string. Grafana falls back to the password "admin" when this is
      # empty — an admin surface with a guessable password, and since the
      # allowlist was removed that surface is the open internet. Compose only
      # evaluates this when this file is merged in, so a platform-only deploy is
      # unaffected.
      # Generated by ./scripts/generate-secrets.sh.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env — see docs/MONITORING.md}
      # Grafana builds absolute URLs (OAuth redirects, share links, alert links)
      # from this. Left at the default it emits http://localhost:3000 links that
      # nobody can follow.
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.localhost}
      # Caddy terminates TLS; Grafana speaks plain HTTP behind it. Telling
      # Grafana the public scheme is https is what keeps its cookies Secure.
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # Two independent controls guard this surface (Caddyfile). Neither of them
      # is anonymous access.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"

      # ── Entra ID (Microsoft Entra / Azure AD) SSO ──────────────────────────
      # Same tenant as Langfuse, separate app registration. Setup, app-role
      # assignment and the cut-over procedure: docs/GRAFANA-SSO.md.
      #
      # INERT BY DEFAULT. With GRAFANA_SSO_ENABLED unset, Grafana behaves exactly
      # as it did before this block existed — the provider is off and none of the
      # empty values below are read. Enabling is a change to infra/.env only.
      #
      # Entra ID OAuth is a Grafana OSS feature. Only Team Sync and org_mapping
      # are Enterprise, and a single-org install needs neither.
      GF_AUTH_AZUREAD_ENABLED: ${GRAFANA_SSO_ENABLED:-false}
      GF_AUTH_AZUREAD_NAME: Microsoft Entra ID
      GF_AUTH_AZUREAD_CLIENT_AUTHENTICATION: client_secret_post
      GF_AUTH_AZUREAD_CLIENT_ID: ${GRAFANA_AZURE_AD_CLIENT_ID:-}
      GF_AUTH_AZUREAD_CLIENT_SECRET: ${GRAFANA_AZURE_AD_CLIENT_SECRET:-}
      # Tenant is shared with Langfuse deliberately — one directory is the whole
      # point of centralising this. The app registration is NOT shared (§2 of
      # docs/GRAFANA-SSO.md explains why).
      GF_AUTH_AZUREAD_AUTH_URL: https://login.microsoftonline.com/${AUTH_AZURE_AD_TENANT_ID:-common}/oauth2/v2.0/authorize
      GF_AUTH_AZUREAD_TOKEN_URL: https://login.microsoftonline.com/${AUTH_AZURE_AD_TENANT_ID:-common}/oauth2/v2.0/token
      GF_AUTH_AZUREAD_SCOPES: openid email profile
      # The tenant lock. Entra has no allowed-domains concept, so pinning the
      # tenant id here is what stops an identity from another directory being
      # accepted — the same role signInAudience=AzureADMyOrg plays for Langfuse
      # (DEPLOYMENT-PITFALLS.md #13). Belt and braces: set BOTH.
      GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS: ${AUTH_AZURE_AD_TENANT_ID:-}
      # Distinct from GF_USERS_ALLOW_SIGN_UP above, which governs Grafana's own
      # signup form. This one governs whether an Entra identity that has no
      # Grafana user yet gets one. It MUST be true: with it false, only accounts
      # that already exist locally could use SSO, which is nobody.
      GF_AUTH_AZUREAD_ALLOW_SIGN_UP: "true"
      # false: an identity with no app role gets auto_assign_org_role (Viewer).
      # true:  an identity with no app role is REFUSED.
      # Start false so the first login can succeed and be verified, then tighten.
      # Flipping to true before roles are assigned locks out everyone at once.
      GF_AUTH_AZUREAD_ROLE_ATTRIBUTE_STRICT: ${GRAFANA_SSO_ROLE_STRICT:-false}
      # Lets the GrafanaAdmin app role grant server-admin, so admin rights are
      # managed in Entra rather than locally. Without it the only server admin is
      # the break-glass local account.
      GF_AUTH_AZUREAD_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_AZUREAD_USE_PKCE: "true"
      # THE BREAK-GLASS SWITCH. While false, the local admin login form stays
      # available alongside SSO. Do not set this true until an Entra login has
      # actually succeeded — verified by signing in, not by reading config
      # (DEPLOYMENT-PITFALLS.md #11). Setting it true with a broken provider
      # locks every human out of the monitoring UI.
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      # This is a private EU platform (GDPR, CLAUDE.md §4). No callbacks out.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Dashboards are provisioned from disk and must stay that way (CLAUDE.md
      # §13, infrastructure as code). This makes the UI refuse edits rather than
      # silently accepting changes that are lost on container replacement.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "10s"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [monitoring]

  # ── Host metrics ──────────────────────────────────────────────────────────
  # CPU, RAM, NVMe and network for the box itself. This is where
  # "days until ClickHouse fills the disk" ultimately comes from — the host
  # filesystem is the authoritative source, and unlike ClickHouse's own async
  # metrics it cannot be wrong about how much space is actually left.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Only real filesystems. Without this, every overlay2 layer and every
      # container mount becomes its own series set — hundreds of series that
      # answer no question.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|rootfs/var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      # High signal, not maximum logging (CLAUDE.md §7.5) applied to metrics.
      # None of these hardware/filesystem subsystems exist on this box.
      - --no-collector.mdadm
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.zfs
      - --no-collector.infiniband
      - --no-collector.bcache
      - --no-collector.xfs
      - --no-collector.btrfs
      - --no-collector.ipvs
      - --no-collector.nvme
      - --no-collector.powersupplyclass
      - --no-collector.thermal_zone
      # Textfile collector: how backup success/failure becomes a METRIC rather
      # than a log line nobody reads. scripts/backup.sh and
      # scripts/restore-test.sh write .prom files here on every run, including
      # failed ones, and infra/prometheus/rules/backups.yml alerts on them.
      #
      # This is the piece that makes F-04 verifiable rather than merely
      # implemented: without it, a backup cron that silently stopped running
      # looks exactly like one that is working.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      # Read-only: node-exporter only ever reads these. The backup scripts run
      # on the host and write to the same path directly.
      - ${BACKUP_METRICS_DIR:-/var/lib/node_exporter/textfile}:/var/lib/node_exporter/textfile:ro
    environment:
      TZ: UTC
    # Needed to see the host's real network and PID namespace rather than the
    # container's. Without it, network and load metrics describe the container.
    pid: host
    restart: unless-stopped
    networks: [monitoring]

  # ── Container metrics ─────────────────────────────────────────────────────
  # Per-container CPU, memory, restarts and OOM kills — the only source that
  # answers "which service is the pressure?" rather than "the box is busy".
  #
  # cAdvisor is the most expensive component here in both CPU and cardinality,
  # which is why it scrapes at 30s and why prometheus.yml drops most of its
  # series. Do not lower that interval without checking the cost.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    command:
      # Only the metric families the dashboards use. cAdvisor's default set is
      # roughly 10x this and most of it is unactionable.
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    # ── privileged: true REMOVED (audit F-09) ────────────────────────────────
    # cAdvisor was running fully privileged, which is effectively root on the
    # host, on the same flat bridge as every datastore. Any cAdvisor CVE was
    # therefore a host-compromise CVE. It is now the least-privileged form that
    # still populates the container and OOM panels:
    #
    #   cap_add SYS_PTRACE      — read other containers' /proc for process state
    #   apparmor:unconfined     — Docker's default profile blocks the cgroup and
    #                             namespace reads cAdvisor needs; this relaxes
    #                             ONE profile rather than granting all caps
    #   devices: /dev/kmsg      — OOM-kill events (declared above)
    #
    # This is documented by upstream cAdvisor as the supported unprivileged
    # configuration, but its requirements genuinely vary by kernel and by
    # cgroup version, so it must be VERIFIED not assumed:
    #
    #   docker compose -f compose.yaml -f compose.monitoring.yaml up -d cadvisor
    #   ./scripts/verify-metric-sources.sh        # container_* families present?
    #   → then open Grafana → Containers, and confirm the OOM panel populates.
    #
    # If a panel goes empty, restore `privileged: true` and record why in
    # docs/DEPLOYMENT-PITFALLS.md rather than leaving a silently blind panel —
    # an empty panel reads as "nothing wrong", which is the failure mode this
    # whole stack exists to avoid.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    environment:
      TZ: UTC
    restart: unless-stopped
    networks: [monitoring]

  # ── Postgres ──────────────────────────────────────────────────────────────
  # Postgres is the crown jewel (CLAUDE.md §13): losing ClickHouse costs trace
  # history, losing Postgres costs every project credential and the platform's
  # identity. Connection saturation is the metric that matters most — Langfuse
  # web and worker both pool against it, and exhaustion presents as an app
  # outage with a perfectly healthy database.
  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.20.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TZ: UTC
      # Reuses the platform's own connection string rather than a second
      # credential to drift out of sync (see DEPLOYMENT-PITFALLS.md #12, where a
      # rotated .env left the Postgres password behind and crash-looped web).
      # sslmode=disable is correct here: this connection never leaves the Docker
      # network, and Postgres is not configured for TLS.
      DATA_SOURCE_NAME: "${DATABASE_URL}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    restart: unless-stopped
    networks: [langfuse]

  # ── Redis / Valkey ────────────────────────────────────────────────────────
  # Two jobs, and the second is the most important metric in this entire stack.
  #
  #  1. Valkey health: memory against the 1GB-per-100k-events/min rule
  #     (CLAUDE.md §8.5), and EVICTIONS. Valkey runs --maxmemory-policy
  #     noeviction deliberately, because it holds the ingestion queue. A non-zero
  #     eviction counter is therefore not a performance note, it is silent
  #     queue-data loss.
  #
  #  2. WORKER QUEUE DEPTH. Langfuse exposes no Prometheus endpoint, so there is
  #     no direct source for the signal CLAUDE.md §11.2 calls the worker scaling
  #     input. But Langfuse's queues are BullMQ, and BullMQ stores waiting jobs
  #     in a Redis list — so the list length IS the queue depth. --check-keys
  #     exports it as redis_key_size, and its derivative gives the growth rate
  #     that §11.2 insists must be read alongside depth.
  #
  # The key pattern is a variable, not a constant, because BullMQ's prefix is a
  # construction-time option and Langfuse does not document which one it passes.
  # Run ./scripts/discover-queue-keys.sh against the live Valkey and set
  # REDIS_QUEUE_KEY_PATTERNS to what it finds. Guessing wrong here does not
  # error — it produces empty panels, which read as a healthy queue.
  redis-exporter:
    <<: *hardening
    image: oliver006/redis_exporter:v1.89.0-alpine
    depends_on:
      redis: { condition: service_healthy }
    environment:
      TZ: UTC
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_AUTH}
      # SCAN-based, so this costs a scan per scrape. Fine at queue-key counts;
      # do not widen these globs to something that matches job payload keys.
      REDIS_EXPORTER_CHECK_KEYS: ${REDIS_QUEUE_KEY_PATTERNS:-bull:*:wait,bull:*:active,bull:*:delayed,bull:*:failed,bull:*:paused}
    restart: unless-stopped
    networks: [langfuse]

  # ── Endpoint probes ───────────────────────────────────────────────────────
  # Probes web and worker on the CONTAINER NETWORK, bypassing Caddy and TLS.
  # That is deliberate: it separates "the application is broken" from "the edge
  # is broken". The cost is that a TLS, DNS or Caddy failure is invisible here —
  # which is one of several reasons this stack does not replace the off-host
  # external monitor required by OPERATIONS.md §5. See docs/MONITORING.md.
  blackbox-exporter:
    <<: *hardening
    image: prom/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    environment:
      TZ: UTC
    restart: unless-stopped
    networks: [langfuse, monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Declared here, not in compose.yaml, so the split exists only when the
  # monitoring stack is merged in. A platform-only deploy never creates it.
  monitoring:
    driver: bridge
